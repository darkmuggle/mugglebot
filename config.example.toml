# MuggleBot configuration — non-secret behavior only.
# Credentials live in the `secrets` table of MuggleBot's SQLite database (not the
# Keychain: a background service endpoint can't read a session-scoped keychain
# without a GUI prompt). Set them on the config page, or with `set_secret` over
# MCP. Copy this to config.toml and edit.

[general]
data_dir = "~/.mugglebot"      # SQLite DB (signals + grounding + secrets) lives here
quiet_hours = "22:00-08:00"    # suppress non-Critical notifications (local time)

[secrets]
# Seal stored credentials under a key derived from $MUGGLEBOT_MASTER_KEY.
# Off by default, and deliberately so: it is a real improvement against a stolen
# backup and none at all against a process running as you, and the DB already
# holds every signal body MuggleBot has ingested. Protect the file.
encrypt = false

[restate]
# The local Restate server (Tilt starts it) and this process's service endpoint.
# Restate holds the work in flight — virtual-object state, invocation journals,
# durable timers, vqueue occupancy. SQLite holds the record. That split is why
# wiping data/restate costs only in-flight work, which matters because enabling
# vqueues requires a fresh cluster.
ingress = "http://127.0.0.1:8080"     # where the daemon submits signals and actions
admin = "http://127.0.0.1:9070"       # registration, the rule book, SQL introspection
endpoint_listen = "127.0.0.1:9080"    # where this process serves its handlers
register_on_boot = true               # Restate discovers handlers at registration
vqueues = true                        # needs RESTATE_EXPERIMENTAL_ENABLE_VQUEUES

# Concurrency per scope. Concurrency is not rate: GitHub's per-hour budget is a
# separate token bucket.
#
# NONE OF THIS APPLIES UNLESS `vqueues = true` under [restate] above. They are separate
# settings, and a tuned block with the flag off is a config that reads as configured and
# behaves as unconfigured. MuggleBot warns at boot if it finds that combination.
[restate.limits]
local_llm = 1                  # one Ollama, one GPU — a queue of one beats four
cloud_llm = 3                  # every concurrent invocation is real money
github = 4
browser = 1                    # one Chrome, one investigation
grafana = 3                    # Grafana HTTP reads — not the browser's 1, which is about
                               # the single Chrome, not about concurrency being unsafe
thread = 1                     # one thread analysis at a time: each is already two
                               # concurrent cloud calls
checkout = 2                   # disk-bound; per-repo limit keys prevent a corrupt tree
repo_index = 1                 # one org crawl at a time: two would clone the same repo
                               # into the same directory

[sources.github]
enabled = true
watch = ["review_requested", "mention", "ci_failure", "assigned"]
poll_interval = "60s"
enrich = true                                    # pull the issue/PR/discussion + triggering comment for context
ignore_prefixes = ["CLA Assistant workflow run"] # drop notifications whose title starts with these

[sources.slack]
enabled = false
user_id = "U0123ABC"                             # your Slack id — flags your own messages
channels = ["#eng"]                              # watched for mentions / keywords
alert_channels = ["#alerts", "#prod-incidents"]  # posts here are alert signals
keywords = ["mugglebot", "prod down"]
search_mentions = false                          # catch mentions of you everywhere (see below)
# mention_query = "<@U0123ABC> OR yourname"      # override the default `<@user_id>` search
poll_interval = "30s"
# Token (a Slack bot/user token with channels:history + channels:read) is stored
# as the secret named "slack".
#
# search_mentions polls search.messages so mentions of you surface from ANY
# conversation you can see — channels outside `channels`, private channels, and
# DMs. It requires the stored "slack" credential to be a USER token (xoxp-…,
# scope search:read); a bot token can't search. The first poll seeds silently
# (no history flood); you get mentions from then on. Note: a user token is your
# full Slack identity and DM content will reach the reasoner — see the README.

[sources.granola]
enabled = false
poll_interval = "2m"
api_base = "https://api.granola.ai"              # override for a proxy/self-host
# Token is stored as the secret named "granola".

[notifications]
min_severity = "notice"        # below this: board-only, no macOS notification
critical_sound = true

[correlation]
window = "30m"                 # time window for entity-based grouping
dedup_threshold = 0.8          # min LLM confidence for a "same" verdict
auto_merge = true              # true → high-confidence "same" verdicts merge duplicate threads
# New activity on a snoozed/acknowledged/resolved thread is matched by the LOCAL
# classifier to decide whether the issue has actually recurred. Handled threads are
# never sent to a cloud model, so this decision is always on-device. Below this
# confidence the thread stays muted — a false reopen re-raises a notification you
# deliberately silenced.
reopen_min_confidence = 0.6

[live]
debounce = "1m"                # wait after last thread activity before re-analysis
debounce_max = "5m"            # hard cap so busy threads still get analyzed
red_alert = true               # red-alert + Critical notification on high-confidence flags
red_alert_min_confidence = 0.75

[reasoner]
# THE LOCAL MODEL DOES THE WORK. Every pass MuggleBot runs on its own — triage,
# correlation, PR critique, root cause, explanation, code indexing, tagging, live
# assist — runs on `local` and nowhere else.
#
# A cloud model is used only when you ask for one, by name, in one of two places:
#
#   1. The chat pane's model picker. Picking Claude there sends that turn, and only
#      that turn, to Claude.
#   2. The 2ND OPINION button on a subject. It re-explains that one subject on
#      `cloud` and shows the answer beside the local one, labelled.
#
# Nothing else can reach it. There is exactly one cloud-capable handle in the code
# (`Reasoners::cloud`) and those are its only two callers, so the guarantee is
# checkable rather than a matter of policy.
#
# "claude"/"chatgpt" run through the subscription CLI bridge (`claude -p` /
# `codex exec`) riding your existing login — no API keys. "ollama_local" is the
# on-device option (endpoint below); "ollama" is Ollama Cloud (ollama.com), which
# needs an API key stored as the secret named "ollama". They're separate
# providers so a hosted model can't get routed at localhost (404) and vice versa.
#
# Pull the local models first:
#   ollama pull deepseek-coder:33b
#   ollama pull qwen2.5vl:7b        # only if you drop images into chat
local = "ollama_local"        # claude | ollama | ollama_local | chatgpt
local_model = "deepseek-coder:33b"
# Images dropped into chat go here. A separate setting because vision is a different
# capability from reasoning: point this at a coder model and MuggleBot will answer
# about a screenshot it never saw. Always built against the local Ollama endpoint.
vision_model = "qwen2.5vl:7b"
# The tier used ONLY when you ask for it — the chat picker or the 2ND OPINION button.
cloud = "claude"
cloud_model = "claude-opus-4-8"
# Escalation tier for [reasoner.routing] below, which is OFF. Only reached if you
# turn routing on, and then only for tasks the local model grades `hard`.
mid = "claude"
mid_model = "claude-sonnet-5"

# How long one local model request may take before it's abandoned. Generous, because a
# 33B model carding a component legitimately takes minutes — but finite, which the HTTP
# client is NOT by default. That default cost 2.5 hours of wedged indexing: one request
# hung, and since local calls share a single permit (below) every later one queued behind
# it forever. A bounded request is what guarantees the permit is released.
request_timeout = "10m"

# Concurrent requests allowed against a SELF-HOSTED Ollama, process-wide — every caller
# (triage, correlation, indexing, chat, explanation) queues on this one permit. One, because
# one Ollama is one GPU: four concurrent requests to a 33B model are slower AND worse than a
# queue of one. Raise it only if the local model is small enough that the GPU isn't the
# bottleneck, or if ollama_url points at a proxy in front of more than one machine.
# Ollama Cloud is never gated by this — it's a fleet. Embeddings aren't either: they're
# milliseconds against a small model, and queueing recall behind a generation would make
# search feel broken.
# One, because one Ollama is one GPU. Priority is by DEFERENCE, not by a second worker:
# indexing stands aside whenever a foreground pass wants the slot — a notification, a PR
# critique, an issue triage — and fills the gaps instead. Note that work already talking
# to the model is not interrupted, so a foreground pass can wait for one carding pass to
# finish (minutes), not for the whole batch (hours).
local_concurrency = 1

# On-device Ollama endpoint (used by "ollama_local" and by local_only_sources).
ollama_url = "http://127.0.0.1:11434"
# Ollama Cloud host (used by the "ollama" provider). Requires the API key stored
# as the secret named "ollama"; hosted models are listed once it's set.
ollama_cloud_url = "https://ollama.com"
ollama_model = "deepseek-coder:33b"  # local_only_sources
# Embeddings are a DIFFERENT capability from chat: coder and chat models have no
# embedding head and answer /api/embeddings with a 500. Keep this pointed at a real
# embedding model — `ollama pull nomic-embed-text`. If it fails, recall silently
# degrades to the built-in lexical hashing embedder rather than breaking.
embed_model = "nomic-embed-text"
local_only_sources = []       # pin sensitive sources here to force on-device Ollama

# NOTE: `local_only_sources` predates the local-by-default policy and is now mostly
# redundant — with routing off, every source is handled on-device anyway. It still
# does one thing: it pins those sources to `ollama_model` even if you later turn
# routing on, so a sensitive source can't be escalated by a config change made for
# unrelated reasons.
#
# The [reasoner.*] sub-tables below must stay LAST in this section: in TOML every
# key after a sub-table header belongs to that sub-table, so a plain `[reasoner]`
# key written below one would silently become e.g. a routing key and be ignored.

# Reuse of previously-computed answers. MuggleBot re-reasons constantly — a thread
# is re-analyzed on every new signal, the same call sites get graded, a restart
# replays work already done — and most of those requests are byte-identical to one
# already answered. Identical request in, stored answer out, no model involved.
# Persisted in SQLite, because a restart is exactly when you most want the answers
# back. Deliberate redos ("reconsider on model X", "re-triage", chat) bypass it.
[reasoner.cache]
enabled = true
ttl = "24h"            # how long an answer stays reusable
max_entries = 5000     # LRU ceiling; 0 disables the size cap

# Difficulty routing: the local model grades how hard a task is, and the grade can
# send it to `mid`/`cloud` instead. OFF, because that is a cloud call nobody asked
# for — which is the one thing the default policy exists to prevent. Grading is
# itself a model call, so leaving it off also stops paying for a judgment whose only
# purpose was deciding whether to escalate.
#
# Turn `enabled` on and MuggleBot will escalate on its own again:
#   easy, medium  -> local alone
#   hard          -> local drafts, `mid` cleans it up (needs cleanup = true)
#   extra_hard    -> `cloud` directly; local doesn't attempt it
[reasoner.routing]
enabled = false        # true → grade every task and escalate on the grade
cleanup = false        # true → a `hard` local draft is sent to `mid` to be corrected
cloud_fallback = false # true → a local outage escalates instead of erroring;
                       # false keeps everything on the machine, and callers''' deterministic
                       # fallbacks still apply

[investigation]
# Root-cause investigation: index the org's repos by READING THEIR CODE (layout,
# manifests, module names — not the README, which states intent and goes stale),
# then search issues/PRs and the commit log for what caused an incident. Needs the
# "github" credential (a token with `repo` read access for private repos) and `git`
# on PATH.
enabled = true
org = "restatedev"
refresh_interval = "24h"       # code re-read cadence. Characterizations are cached
                               # against the commit they were built from, so an
                               # unchanged repo costs a shallow fetch and no model call
default_repos = ["restatedev/restate"]  # where to look when nothing else matches
skip_stale_repos = true        # don't check out repos with no push in a year…
stale_repo_days = 365          # …but keep them indexed as metadata
commit_window = "72h"          # how far before the first signal to scan the log
code_search = true             # if no issue/PR/commit explains it, find the code
shortlist_size = 8             # candidates the LOCAL pass forwards to the cloud
                               # model for the final verdict — the escalation
                               # boundary; crawling and filtering stay on-device

# Deterministic symptom→repo routes, applied before the model reads the index.
# Key = case-insensitive substring of the symptom text; value = repos it routes to.
# Everything not matched here is routed by the classifier reading the README cards.
[investigation.routes]
cloud = ["restatedev/restate-cloud"]
environment = ["restatedev/restate-cloud"]
provisioning = ["restatedev/restate-cloud"]
"control plane" = ["restatedev/restate-cloud"]
"restate runtime" = ["restatedev/restate"]
invocation = ["restatedev/restate"]
"partition processor" = ["restatedev/restate"]

[assigned]
# Issues assigned to you on GitHub. Assignment is a standing state, not an event:
# an issue assigned three weeks ago with no activity since produces no
# notification at all — which is exactly the one likely to have fallen off your
# radar. So these are polled directly and ALWAYS get a board card, whether or not
# a notification ever existed.
#
# Each one is then triaged against the real source: the repo is checked out
# (shallow, read-only), the local coder model reads the code and characterizes the
# issue, proposes `patches` distinct approaches, and the `brief` model renders it
# in plain English. Patches are proposals with files/risk/effort — never applied,
# and nothing is ever pushed to a repository. Needs `git` on PATH.
enabled = true
poll_interval = "5m"
checkout_dir = "repos"         # relative paths resolve under general.data_dir
max_checkout_mb = 500          # refuse to clone anything bigger (per repo, judged
                               # from GitHub's reported size)
# Ceiling on the WHOLE checkout cache. Indexing an org means a clone per repo, and
# the per-repo limit says nothing about their sum — measured on a real org, five
# repos came to 427MB (one docs site alone was 335MB of assets). Over budget,
# least-recently-used checkouts are evicted. 0 disables the cap.
max_cache_mb = 5000
patches = 3                    # how many distinct approaches to ask for
# Sized for a LOCAL coder model's context window, not for coverage. An over-large
# source dump pushes the instructions and the issue out of the front of the window,
# and the model answers "describe this code" instead of the question you asked.
# Raise these only if you point `local_model` at something with a bigger context.
max_files = 6                  # source files shown to the model
max_file_chars = 3000          # per-file budget, so one big file can't crowd out the rest
retriage_on_new_commits = true
# Scan the repo's OPEN pull requests for one that already fixes the issue — often
# somebody else's. Reads each candidate's diff, states what it implements,
# critiques whether it really fixes the issue, and notes what else it would
# resolve. Local model first; escalates to `brief` then the routed tier only if
# the local pass can't produce a usable answer.
check_open_prs = true

[personas]
# Personas — the "who is this work with" axis.
#
# A persona is a candid behavioural model of one colleague, built from things they
# actually wrote: their GitHub reviews and comments, their Slack messages, and the
# lines attributed to them in meeting transcripts. You then select personas against
# an issue or pull request and get a prediction — the review they would leave, the
# comment they would write, or that they would not engage at all — and you can talk
# to one in the chat pane to rehearse a conversation before having it.
#
# Three things worth knowing before turning it on.
#
# It is OPT-IN PER PERSON. There is no setting that models everybody who has ever
# posted. You name the people you want modelled; MuggleBot proposes candidates
# ranked by how much you actually deal with them, and creating each one is a
# decision. Several hundred profiles of near strangers would bury the handful that
# matter — and would be doing it to real people without anyone asking.
#
# Every claim CITES EVIDENCE or is dropped. A profile is a set of falsifiable
# claims about observable behaviour ("asks for a test on anything touching the
# store, in 4 of 6 reviews"), each carrying the excerpts it came from, with
# contradicting excerpts kept and shown. Claims that are unfalsifiable — generic
# virtue, or anything inferred about somebody's health, politics or personal life —
# are removed deterministically, and what was removed is shown to you. That is what
# makes the thing candid AND useful: "cares about quality" predicts nothing, and a
# model told to be candid without the constraint writes fluent character
# assassination instead of a prediction.
#
# NOTHING IS EVER POSTED. A predicted review is a private rehearsal, on the same
# footing as every other critique here. See README → "Nothing is ever written back
# to GitHub".
#
# Cost: harvesting Slack and meeting evidence is a SQL query over signals already
# ingested — free. GitHub evidence is a couple of searches plus a handful of comment
# reads per pass, at background priority, so it defers to the watchers. Profiling is
# one LOCAL model pass per facet (ten of them), which is minutes on the single GPU
# lane; nothing about a persona is sent to a cloud model unless you pick one by name
# in the pane.
enabled = false
history_days = 90              # how far back to read their GitHub history
harvest_interval = "12h"       # re-check a persona whose history walk has finished
backfill_interval = "10m"      # one more page of history, while there is history left
auto_profile = true            # re-distil when a pass finds new material
max_proposals = 25             # candidates offered by "propose"
# Refresh a persona when they are seen being active, rather than only on the timer.
# A profile that refreshes twice a day is stale exactly when it matters — you are
# about to ask somebody about the thing they were talking about ten minutes ago.
# Debounced, and the Slack evidence it mostly picks up is a SQL query, so it is cheap.
refresh_on_engagement = true
engagement_debounce = "2m"
# Which tier forms the opinion — distils the traits AND predicts. One setting for
# both: they are the same cited-JSON contract and fail the same way.
#   cloud (Claude, default) | code (the triage tier) | local
#
# THE ONE DEFAULT HERE THAT IS NOT ON-DEVICE, and it was earned rather than chosen. The
# local 33B model produced sensible claims and then mangled the citation ids, so
# verification correctly dropped every one; once that was fixed it asserted 100%
# confidence, duplicated claims across facets, and returned nothing usable for half of
# them. Every safeguard still applies whichever tier answers — falsifiability, citations,
# counter-evidence, the confidence ceiling, the removal report. A stronger model simply
# clears the bar more often.
#
# The cost, plainly: on any tier but `local`, harvested excerpts of your colleagues'
# writing LEAVE THE MACHINE. They ride the subscription CLI bridge, so nothing is
# metered — but "unmetered" is not "on-device". Set `local` to keep it on the Mac and
# accept a thinner profile.
profile_tier = "cloud"

# Link BOTH handles. The same person is terse on GitHub and chatty in Slack, and the
# profile tracks each separately — a persona with one source predicts one register.
# A Slack name or @handle is resolved against the workspace directory (cached from
# `users.list`), so you do not need to go and find the U… id. Slack evidence is a SQL
# query over signals already ingested and lands immediately; GitHub evidence is API
# calls walked back over `history_days`. If you only fill in one, fill in Slack.

[browser]
# Authenticated browser control. When a Slack alert links to a dashboard, the page
# behind that link holds the actual numbers — and it's behind SSO. MuggleBot drives
# your ALREADY SIGNED-IN Chrome over the DevTools Protocol, via the agent CLI with a
# browser MCP server attached.
#
# Start Chrome with the debug port first (once, and keep it running):
#   "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --remote-debugging-port=9222
#
# Note this is NOT the Claude-in-Chrome / ChatGPT-Atlas extension: those attach a
# model to a tab from inside the browser UI and can't be handed a URL by a daemon.
# The CLI + CDP path reaches the same authenticated page and is automatable.
#
# READ-ONLY BY CONSTRUCTION: `allowed_tools` grants navigate/read/screenshot and
# never click/fill/evaluate, and `--strict-mcp-config` means your own MCP servers
# (and their write tools) are not inherited. An investigation cannot acknowledge or
# silence an alert even if the page tries to talk it into doing so.
enabled = false
agent = "claude"               # claude (`claude -p`) | chatgpt (`codex exec`)
model = "claude-sonnet-5"
browser_url = "http://127.0.0.1:9222"
mcp_command = "npx"
mcp_args = ["-y", "chrome-devtools-mcp@latest"]
allowed_tools = [
  "navigate_page", "take_snapshot", "take_screenshot",
  "list_console_messages", "list_network_requests", "wait_for",
]
url_patterns = ["grafana"]     # link substrings worth opening a browser for
timeout = "5m"                 # hard cap per investigation, then the agent is killed
max_attempts = 3               # give up on a link after this many failures

[grafana]
# Grafana as an EVIDENCE source: the numbers behind an alert, over the HTTP API.
#
# The tier above reads a rendered page and reports what it looked like. This one asks
# Grafana for the series. It works because a Grafana alert's Slack message links the
# ALERT RULE, and from that one UID the whole chain is available:
#
#   /api/v1/provisioning/alert-rules/{uid}  the rule: its queries, its threshold, its `for`
#   /api/dashboards/uid/{uid}               panel definitions, and the queries behind them
#   /api/ds/query                           those queries, over the alert's own window
#
# So the conclusion quotes figures you can go and re-run, and every figure in it is
# checked against the series it came from — a figure that can't be found is marked rather
# than printed as fact. That check is the reason this tier exists.
#
# CREDENTIAL: store a `grafana` secret (config page, or `mugglebot secret set grafana`).
# Use a VIEWER service-account token. A Viewer cannot silence an alert or save a
# dashboard, so read-only here is a property of the token rather than of an allowlist —
# which is stricter than the browser tier can be.
#
# NOT A WATCHER. Grafana raises its alerts into Slack and Slack is already ingested, so
# polling Grafana too would open a second subject for a firing this system already has.
# It is asked a question when an alert arrives and is silent otherwise.
enabled = false
base_url = ""                  # e.g. "https://acme.grafana.net" — also used to spot its links
lookback = "6h"                # window when the alert's own link carries no from/to
timeout = "60s"                # per request; /api/ds/query over a wide range is the slow one
fallback_to_browser = true     # hand the alert to [browser] when Grafana can't answer

[threads]
# Slack thread analysis, asked for by hand. Paste a thread permalink; two models read it
# independently and you get told what happened — including your own part in it.
#
# WHY TWO MODELS. One model asked "was anyone unreasonable here" gives a confident answer
# either way, and its particular flavour of agreeableness is a property of that model. So
# Claude and ChatGPT get the same prompt, at the same time, neither seeing the other's
# answer, and the result marks which findings BOTH reached. There is deliberately no third
# pass to reconcile them: a synthesiser turns two analyses into one, which smooths away the
# disagreement — the most informative thing on the page.
#
# WHAT KEEPS IT HONEST. Every finding must cite the messages it rests on, and any text the
# model puts in quotes is checked character-by-character against the thread; a finding
# quoting words nobody wrote is discarded and shown as discarded. "Nothing to call out" is
# an explicitly allowed answer, because a prompt that demands criticism manufactures it.
#
# This uses cloud models, breaking the local-by-default rule on purpose: it only runs
# because you pasted a link, and the whole value is two DIFFERENT readers. One local model
# twice is one opinion twice.
#
# Needs the `slack` credential (to read the thread) and [sources.slack].user_id — without
# the latter nothing can be attributed to you, which is the section you came for.
# Set either model to "" to drop it from the panel; findings then come back uncorroborated.
enabled = false
claude_model = "claude-opus-5"
chatgpt_model = "gpt-5.6-sol"   # NOT "gpt-5.6": Codex on a ChatGPT account rejects that
                               # name, and the panel then quietly drops to one model

[mcp]
stdio = true
http_listen = "127.0.0.1:8787"

[ui]
listen = "127.0.0.1:8081"      # 8080 belongs to the local Restate ingress
